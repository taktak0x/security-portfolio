name: PR quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check CSP script hashes
        run: node scripts/check-csp-hashes.mjs

      - name: Check metadata
        run: pnpm run check:meta

      - name: Check accessibility
        run: pnpm run check:a11y

      - name: Set up Brave
        run: |
          curl -fsSLo /tmp/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo install -D -o root -g root -m 0644 /tmp/brave-browser-archive-keyring.gpg /etc/apt/keyrings/brave-browser-archive-keyring.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y brave-browser
          test -x /usr/bin/brave-browser

      - name: Check browser interactions
        run: pnpm run check:interactions
        env:
          BRAVE_BIN: /usr/bin/brave-browser

      - name: Check performance budgets
        run: pnpm run check:lighthouse
